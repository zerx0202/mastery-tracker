services:
  backend:
    build: .
    container_name: riot-backend
    env_file: .env
    restart: unless-stopped
    # proces w kontenerze chodzi jako zwykly uzytkownik hosta, nie root:
    # przy bind moncie ./data root w kontenerze = zapis na dysku Maca.
    # 501:20 to domyslny pierwszy uzytkownik macOS; nadpisywalne w .env.
    user: "${APP_UID:-501}:${APP_GID:-20}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/code/data
      - ./tools:/code/tools:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy

networks:
  proxy:
    external: true
