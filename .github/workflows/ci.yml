name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Zaleznosci
        run: pip install -r requirements.txt pytest ruff
      - name: Ruff (m.in. niezdefiniowane nazwy - dzisiejsza klasa bledow)
        run: ruff check app/ agent/ tests/
      - name: Pytest
        run: pytest tests/ -q
